{% extends "base.html" %}

{% block title %}Register Vehicle{% endblock %}

{% block content %}
<h1 class="page-title">Vehicle Registration</h1>

<div class="card">
    <h3>Vehicle and Owner Details</h3>

    <form method="POST" action="/register-vehicle">

        <div class="form-row">
            <div class="form-group">
                <label for="vehicle_number">Vehicle Number *</label>
                <input type="text" id="vehicle_number" name="vehicle_number"
                       placeholder="Example: TN81E1030" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="vehicle_type">Vehicle Type *</label>
                <select id="vehicle_type" name="vehicle_type" required>
                    <option value="">-- Select type --</option>
                    <option>Two Wheeler</option>
                    <option>Car</option>
                    <option>Auto Rickshaw</option>
                    <option>Bus</option>
                    <option>Lorry / Truck</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="owner_name">Owner Name *</label>
                <input type="text" id="owner_name" name="owner_name"
                       placeholder="Enter owner name" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="owner_phone">Owner Phone</label>
                <input type="text" id="owner_phone" name="owner_phone"
                       placeholder="10-digit mobile number"
                       pattern="[0-9]{10}" title="Enter exactly 10 digits">
            </div>
        </div>

        <div class="form-group">
            <label for="owner_address">Owner Address</label>
            <textarea id="owner_address" name="owner_address" rows="3"
                      placeholder="Enter address" maxlength="255"></textarea>
        </div>

        <button type="submit" class="btn btn-green">Register Vehicle</button>
        <a href="/dashboard" class="btn btn-grey">Cancel</a>
    </form>
</div>
{% endblock %}
